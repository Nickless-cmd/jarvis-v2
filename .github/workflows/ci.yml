name: ci

on:
  push:
  pull_request:

jobs:
  commit-attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate outgoing commit attribution
        env:
          PRE_COMMIT_FROM_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRE_COMMIT_TO_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$PRE_COMMIT_FROM_REF" =~ ^0+$ ]]; then
            export PRE_COMMIT_FROM_REF=""
          fi
          python scripts/validate_commit_attribution.py --pre-push

  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall core apps/api scripts

  # Struktur-vagterne: de pytest-tests der haandhaever husets egne regler.
  #
  # Tilfoejet 20/9-2026, efter at push-vejen havde vaeret tavs: vagten fandtes
  # (tests/test_publish_scan.py), og testen der fangede fejlen fandtes — men
  # INTET job koerte den. pre-commit koerer 16 script-vagter, ingen af dem
  # pytest, og pre-commit kan springes over med `git commit --no-verify`.
  # Det kan dette job ikke. Som kommentaren paa desk-jobbet siger: en vagt der
  # kun koerer naar nogen husker at koere den er ingen vagt.
  #
  # Hele tests/ kan IKKE koere her: maalt 20/9-2026 naaede den 1% paa 18
  # minutter (1540 testfiler). Listen over de statiske vagter bor i
  # tests/vagter.txt og tager ~35 s. Peger en linje paa en fil der ikke
  # findes, fejler pytest med exit 4 — listen kan ikke raadne tavst.
  python-vagter:
    name: python-vagter (struktur-vagterne)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Installer afhaengigheder
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout
      - name: Koer vagterne
        run: grep -v '^[[:space:]]*#' tests/vagter.txt | xargs pytest -q

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install detect-secrets
        run: pip install detect-secrets
      - name: Scan for secrets
        run: |
          detect-secrets scan \
              --baseline .secrets.baseline \
              --exclude-files '\.claude/worktrees/.*|\.git/.*|.*\.ipynb|.*/__pycache__/.*'

  # jarvis-desk: lint + typecheck + tests.
  #
  # Tilfoejet 8/9-2026 efter at et `useMemo` under en betinget return braekkede
  # hele visningen med React #310. tsc var ren, alle 605 tests groenne, buildet
  # lykkedes og releasen gik ud — appen var ubrugelig foerst da Bjoern aabnede
  # den. `react-hooks/rules-of-hooks` fanger praecis den fejl, og en vagt der
  # kun koerer naar nogen husker at koere den er ingen vagt.
  desk:
    name: desk (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/jarvis-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/jarvis-desk/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: npx vitest run
