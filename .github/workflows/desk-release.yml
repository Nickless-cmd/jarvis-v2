name: desk-release

# Bygger jarvis-desk (Electron-appen "Jarvis") til Linux, macOS OG Windows når
# et release-tag pushes, og uploader artefakterne til GitHub-releasen for det tag.
#
# Kommentaren her sagde indtil 8/9-2026 at Windows byggedes manuelt. Det var
# forældet: matrixen nedenfor har haft windows-latest hele tiden, og de sidste
# releases bærer alle tre — .deb + .AppImage, .dmg + mac.zip (universal), .exe.
# En kommentar der modsiger koden er værre end ingen kommentar.
#
# Builds er USIGNEREDE — Gatekeeper/SmartScreen advarer; forventet.

on:
  push:
    tags:
      - "jarvis-desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Eksisterende tag at bygge + uploade til (fx jarvis-desktop-v0.2.24)"
        required: true

permissions:
  contents: write

jobs:
  # Opretter releasen ÉN gang før build-matrixen, så de 3 parallelle platform-jobs
  # ikke racer om at CREATE'e samme tag (det gav "already_exists" → Linux-artefakter
  # tabt på 0.2.94). Bagefter UPLOADER build-jobs kun til den eksisterende release.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
              --notes "Automated desk release $tag"

  build:
    name: build-${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    defaults:
      run:
        working-directory: apps/jarvis-desk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/jarvis-desk/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Package (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Ingen Apple-signing/notarisering sat op — byg usigneret.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Tre jobs uploader til SAMME release samtidig. `action-gh-release`
      # HENTER release'en foer den uploader, og netop det opslag fejlede med
      # HttpError i to ud af tre bygninger 15/9-2026 — mac paa 0.3.70, win paa
      # 0.3.71. Forskelligt job hver gang, altsaa et kaploeb og ikke et
      # kodeproblem. Linux-filerne naaede frem begge gange.
      #
      # `gh release upload` springer opslaget over (release'en er allerede
      # oprettet af `prepare`-jobbet) og kan proeves igen. `--clobber` goer en
      # gentagelse ufarlig, ogsaa naar man koerer et fejlet job om.
      - name: Upload til GitHub-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          shopt -s nullglob
          filer=(release/*.deb release/*.AppImage release/*.dmg release/*.zip
                 release/*.exe release/latest*.yml release/*.blockmap)
          if [ ${#filer[@]} -eq 0 ]; then
            echo "Ingen filer for denne platform — intet at uploade."
            exit 0
          fi
          printf 'Uploader %s fil(er):\n' "${#filer[@]}"
          printf '  %s\n' "${filer[@]}"
          for forsoeg in 1 2 3 4 5; do
            if gh release upload "$tag" "${filer[@]}" \
                 --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Uploadet i forsoeg $forsoeg."
              exit 0
            fi
            vent=$((forsoeg * 10))
            echo "Forsoeg $forsoeg fejlede — venter ${vent}s og proever igen."
            sleep "$vent"
          done
          echo "Kunne ikke uploade efter 5 forsoeg."
          exit 1
