name: desk-release

# Bygger jarvis-desk (Electron-appen "Jarvis") til Linux, macOS OG Windows når
# et release-tag pushes, og uploader artefakterne til GitHub-releasen for det tag.
#
# Kommentaren her sagde indtil 8/9-2026 at Windows byggedes manuelt. Det var
# forældet: matrixen nedenfor har haft windows-latest hele tiden, og de sidste
# releases bærer alle tre — .deb + .AppImage, .dmg + mac.zip (universal), .exe.
# En kommentar der modsiger koden er værre end ingen kommentar.
#
# Builds er USIGNEREDE — Gatekeeper/SmartScreen advarer; forventet.

on:
  push:
    tags:
      - "jarvis-desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Eksisterende tag at bygge + uploade til (fx jarvis-desktop-v0.2.24)"
        required: true

permissions:
  contents: write
  # Gate-jobbet læser `actions/runs` for samme SHA. Når permissions-blokken
  # er angivet eksplicit, sætter GitHub ALLE uspecificerede scopes til `none`
  # — så uden denne linje ville opslaget få 403, og gaten ville afvise hver
  # eneste release. Fail-safe, men blind: præcis den fejlform gaten findes
  # for at forhindre.
  actions: read

jobs:
  # Opretter releasen ÉN gang før build-matrixen, så de 3 parallelle platform-jobs
  # ikke racer om at CREATE'e samme tag (det gav "already_exists" → Linux-artefakter
  # tabt på 0.2.94). Bagefter UPLOADER build-jobs kun til den eksisterende release.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists (som KLADDE)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # KLADDE, ikke en offentlig release. Målt 8/10-2026: `gh release
          # create` uden `--draft` gjorde releasen SYNLIG i det øjeblik jobbet
          # kørte — 81 sekunder efter tag-pushet og ~15 minutter før den første
          # fil fandtes. I det vindue læste release-vagten
          # (`apps/api/jarvis_api/routes/app_release.py`, der læser
          # `releases.atom`) den som en ny version og udsendte
          # `app.release.available`; desk kaldte `checkForUpdates()` og fik 404
          # på `latest-linux.yml`, fordi asset'en endnu ikke var uploadet.
          # Kladder optræder ikke i atom-feedet (det er offentligt og uden
          # token), så en kladde er usynlig for både vagten og updateren.
          # Publiceringen sker i `publish` — EFTER at alle filer er verificeret.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
              --draft \
              --notes "Automated desk release $tag"

  build:
    name: build-${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    defaults:
      run:
        working-directory: apps/jarvis-desk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/jarvis-desk/package-lock.json

      # TAG MÅ MATCHE VERSIONEN (11/11-2026). Releasen jarvis-desktop-v0.6.335
      # endte med 19 assets: otte 0.6.332-navngivne binærer laa blandet med de
      # rigtige 0.6.335-filer, fordi to runs ramte samme tag fra commits hvor
      # package.json sagde noget andet end tagget. Feeden (latest.yml) var
      # korrekt hele tiden — men et menneske der henter manuelt fra
      # releasesiden kunne faa en binær der hed noget andet end den fik.
      # Vagten staar FOER build, saa et forkert tag koster sekunder, ikke en
      # halv release.
      - name: Tag skal matche package.json-version
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "jarvis-desktop-v${version}" ]; then
            echo "::error::Tag '$tag' matcher ikke apps/jarvis-desk/package.json version '$version' (forventede 'jarvis-desktop-v${version}')."
            echo "Et tag maa ikke saettes paa en commit hvis version ikke matcher tag-navnet — det giver assets med to forskellige versionsnumre i samme release."
            exit 1
          fi
          echo "Tag og version matcher: $tag"

      - name: Install deps
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Package (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Ingen Apple-signing/notarisering sat op — byg usigneret.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ÉN SKRIVER. Tidligere uploadede alle tre platform-jobs direkte til
      # samme release, og det gav et TAVST tab: 23/9-2026 meldte win-jobbet
      # exit 0 med `latest.yml` navngivet i loggen, og filen var alligevel
      # ikke i release'en. Et samtidigt upload havde overskrevet asset-listen.
      #
      # Retry-loekken der stod her kunne ikke fange det: den proever kun igen
      # ved en FEJLKODE, og der var ingen. Derfor laegger platform-jobbene nu
      # deres filer op som workflow-artefakter, og ét afsluttende job samler
      # dem og uploader — saa er der kun én skriver til release'en.
      - name: Gem artefakter til publicering
        uses: actions/upload-artifact@v4
        with:
          name: desk-${{ matrix.platform }}
          path: |
            apps/jarvis-desk/release/*.deb
            apps/jarvis-desk/release/*.AppImage
            apps/jarvis-desk/release/*.dmg
            apps/jarvis-desk/release/*.zip
            apps/jarvis-desk/release/*.exe
            apps/jarvis-desk/release/latest*.yml
            apps/jarvis-desk/release/*.blockmap
          if-no-files-found: error
          retention-days: 3

  # GATEN. Målt 22/11-2026: release 0.6.420 blev publiceret med 11 artefakter
  # mens `ci` for SAMME commit (d624a4075, run 45019130847) fejlede — to røde
  # jobs, «desk (lint + typecheck + test)» og «desk (browser-målinger)».
  # `desk-release` havde ingen afhængighed til `ci`, så en rød testkørsel kunne
  # ikke blokere publiceringen. Det er den tavse fejlklasse: releasen ser grøn
  # ud, fordi den eneste der spørger den, er updateren.
  #
  # Jobbet ligger MELLEM build og publish, ikke før build: de tre platforme
  # bygger parallelt (10-15 min), og gaten venter på `ci` i det vindue. Lå den
  # først, ville den lægge sin ventetid oveni i stedet for ved siden af.
  #
  # `ci` trigges på `push` — også på tag-pushes — så der FINDES en kørsel for
  # tag-ref'en. Målt 22/11-2026: run 45028233539 (ref=jarvis-desktop-v0.6.423,
  # sha 8f3b82a08) → success. Vi slår op på SHA, ikke på ref, fordi det er
  # commit'en der bliver udgivet — ikke grenen den blev tagget fra.
  gate:
    name: ci skal være grøn for samme commit
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Vent på ci for denne SHA — og afvis hvis den er rød
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Commit: $SHA"

          # Vi venter i op til 40 minutter. `ci` kører typisk 8-12 min, men
          # desk-browser-jobbet på ubuntu-24.04 med Playwright-installation
          # kan trække ud. Loftet er der for at undgå at hænge i GitHub's
          # 6-timers grænse uden at nogen får besked.
          #
          # OPSLAGET SKER PÅ FULD SHA. Målt 22/11-2026: både
          # `gh run list --commit 8f3b82a08` og
          # `gh api .../runs?head_sha=8f3b82a08` svarer `[]` — tomt, ikke
          # fejl — fordi API'et kræver den fulde 40-tegns SHA. Med kort SHA
          # ville gaten stå og vente 40 minutter på en kørsel den aldrig så,
          # og derefter fejle på timeout. `github.sha` ER fuld, men vi
          # normaliserer alligevel, så et kort input ikke kan gøre den blind.
          # Gate-jobbet har ingen `actions/checkout`, så der er INTET git-repo
          # her: en `git rev-parse` ville fejle hver gang og falde tilbage til
          # den rå værdi. Målt 22/11-2026 — den normalisering var død kode der
          # så ud som et værn. I stedet kræver vi formen: 40 hex-tegn. Er
          # `github.sha` ikke det, fejler vi højt frem for at slå et forkert
          # opslag op og vente 40 minutter på et tomt svar.
          #
          # Tagget er lightweight (`git cat-file -t` → `commit`), så
          # `github.sha` ER commit-SHA'en ved et tag-push.
          FULL="$SHA"
          echo "Fuld SHA: $FULL"
          case "$FULL" in
            *[!0-9a-f]*|"")
              echo "SHA er ikke fuld hex: '$FULL' — kan ikke slaa ci op."
              exit 1 ;;
          esac
          if [ "${#FULL}" -ne 40 ]; then
            echo "SHA har ${#FULL} tegn, ikke 40: '$FULL' — API'et kraever fuld SHA."
            exit 1
          fi

          # Python, ikke jq: jq er ikke installeret i alle miljøer vi kører
          # gaten fra (målt 22/11-2026: mangler i runtime-containeren), og en
          # gate der fejler på et manglende værktøj er blind på samme måde som
          # en der ikke kan læse API'et. python3 findes på ubuntu-latest.
          vurder() {
            python3 - "$1" <<'PYEOF'
          import json, sys
          raa = json.loads(sys.argv[1])
          runs = [r for r in raa.get("workflow_runs", [])
                  if r.get("name") == "ci" and r.get("event") == "push"]
          if not runs:
              print("INGEN"); raise SystemExit
          roede = [r for r in runs if r.get("conclusion") == "failure"]
          if roede:
              print("ROED")
              for r in runs:
                  print(f"  run {r['id']}: {r.get('status')}/{r.get('conclusion')}")
              raise SystemExit
          uafsluttede = [r for r in runs
                         if r.get("status") != "completed" or r.get("conclusion") is None]
          if uafsluttede:
              print(f"KOERER {len(uafsluttede)}"); raise SystemExit
          ikke_groen = [r for r in runs if r.get("conclusion") != "success"]
          if ikke_groen:
              print("IKKE_GROEN")
              for r in runs:
                  print(f"  run {r['id']}: {r.get('status')}/{r.get('conclusion')}")
              raise SystemExit
          print("GROEN")
          for r in runs:
              print(f"  run {r['id']}: {r.get('status')}/{r.get('conclusion')}")
          PYEOF
          }

          for i in $(seq 1 80); do
            raa="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$FULL&per_page=50" 2>&1)" || {
              echo "Kunne ikke læse ci-kørsler: $raa"
              # Kan vi ikke SE ci, må vi ikke publicere. En gate der svarer
              # «alt fint» når API'et tier, er samme fejlklasse som
              # ci_status_watch blev skrevet for at fange.
              exit 1
            }

            udfald="$(vurder "$raa")"
            dom="$(printf '%s' "$udfald" | head -1)"

            case "$dom" in
              INGEN)
                echo "Forsoeg $i: ingen ci-koersel for $FULL endnu — venter 30s."
                sleep 30 ;;
              KOERER*)
                echo "Forsoeg $i: ci koerer endnu (${dom#KOERER }) — venter 30s."
                sleep 30 ;;
              GROEN)
                echo "ci er GROEN for $FULL — gaten aabner."
                printf '%s\n' "$udfald" | tail -n +2
                exit 0 ;;
              ROED)
                echo "ci er ROED for $FULL — releasen publiceres ikke."
                printf '%s\n' "$udfald" | tail -n +2
                exit 1 ;;
              IKKE_GROEN)
                echo "ci er ikke groen for $FULL (conclusion != success) — publicerer ikke."
                printf '%s\n' "$udfald" | tail -n +2
                exit 1 ;;
              *)
                echo "Ukendt udfald fra vurderingen: $udfald"
                exit 1 ;;
            esac
          done

          echo "Timeout: ci blev ikke faerdig for $FULL inden for 40 minutter."
          echo "Releasen forbliver en kladde — en uverificeret version skal ikke kunne hentes."
          exit 1

  # Den eneste der skriver til release'en.
  publish:
    needs: [build, gate]
    runs-on: ubuntu-latest
    steps:
      - name: Hent alle platformes artefakter
        uses: actions/download-artifact@v4
        with:
          path: artefakter

      - name: Upload samlet — og VERIFICER at alt landede
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # `mapfile` + `find -print0`, IKKE `$( ... )`: Windows-filen hedder
          # «J.A.R.V.I.S Setup 0.6.81.exe» MED mellemrum, og en tur gennem
          # kommando-substitution ordopdeler den i tre stumper. Maalt 23/9-2026:
          # «no matches found for artefakter/desk-win/J.A.R.V.I.S». Det gamle
          # workflow ramte det aldrig, fordi hver platform globbede sine egne
          # filer direkte ind i et array.
          mapfile -d '' filer < <(find artefakter -type f -print0)
          if [ ${#filer[@]} -eq 0 ]; then
            echo "Ingen artefakter — build-jobbene leverede intet."
            exit 1
          fi
          printf 'Uploader %s fil(er):\n' "${#filer[@]}"
          printf '  %s\n' "${filer[@]}"

          for forsoeg in 1 2 3 4 5; do
            if gh release upload "$tag" "${filer[@]}" \
                 --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Uploadet i forsoeg $forsoeg."
              break
            fi
            # En manglende fil er ikke forbigaaende. At proeve igen fem gange
            # brugte 2,5 minut paa at gentage den samme fejl (23/9-2026), og
            # skjulte at aarsagen var vores egen filliste og ikke GitHub.
            for f in "${filer[@]}"; do
              [ -f "$f" ] || { echo "Filen findes ikke: $f — ikke et forbigaaende problem."; exit 1; }
            done
            vent=$((forsoeg * 10))
            echo "Forsoeg $forsoeg fejlede — venter ${vent}s."
            sleep "$vent"
            if [ "$forsoeg" = 5 ]; then echo "Kunne ikke uploade."; exit 1; fi
          done

          # VERIFIKATION. Det forrige tab var tavst: upload'en sagde ok, filen
          # var der ikke. Nu spoerger vi release'en hvad den FAKTISK har, og
          # fejler hoejlydt hvis noget mangler.
          echo "Verificerer at alle filer er i release'en…"
          # GitHub OMDOEBER ved upload: alt uden for [A-Za-z0-9._-] bliver til
          # et punktum, saa «J.A.R.V.I.S Setup 0.6.81.exe» ligger som
          # «J.A.R.V.I.S.Setup.0.6.81.exe». Maalt 23/9-2026: uden den regel
          # meldte verifikationen de to Windows-filer MANGLENDE, selvom alle
          # elleve laa der. Begge sider normaliseres, saa vi sammenligner
          # aebler med aebler.
          normaliser() { sed 's/[^A-Za-z0-9._-]/./g'; }
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' | normaliser | sort > /tmp/oppe.txt
          mangler=0
          for f in "${filer[@]}"; do
            raat="$(basename "$f")"
            navn="$(printf '%s' "$raat" | normaliser)"
            if ! grep -Fxq "$navn" /tmp/oppe.txt; then
              echo "MANGLER i release'en: $raat (som '$navn')"
              mangler=1
            fi
          done
          if [ "$mangler" = 1 ]; then
            echo "Release'en er ufuldstaendig — feeden ville love en version den ikke kan levere."
            exit 1
          fi
          echo "Alle ${#filer[@]} filer bekraeftet i release'en."

          # FØRST NU bliver releasen offentlig. Rækkefølgen er hele pointen:
          # filerne ligger der, FØR nogen kan se versionen. Fejler noget ovenfor
          # (manglende fil, fejlet upload), når vi aldrig hertil — og releasen
          # forbliver en kladde, som ingen klient kan se. Det er den rigtige
          # fejlretning: en ufuldstændig release skal være USYNLIG, ikke
          # synlig-og-i-stykker.
          #
          # Målt 8/10-2026: uden det her lå v0.6.211 offentligt med 0 assets i
          # ~15 minutter, og desk svarede «Cannot find latest-linux.yml in the
          # latest release artifacts» da Bjørn trykkede «installer nu».
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Release $tag er publiceret — med alle ${#filer[@]} filer."
