name: desk-release

# Bygger jarvis-desk (Electron-appen "Jarvis") til Linux, macOS OG Windows når
# et release-tag pushes, og uploader artefakterne til GitHub-releasen for det tag.
#
# Kommentaren her sagde indtil 8/9-2026 at Windows byggedes manuelt. Det var
# forældet: matrixen nedenfor har haft windows-latest hele tiden, og de sidste
# releases bærer alle tre — .deb + .AppImage, .dmg + mac.zip (universal), .exe.
# En kommentar der modsiger koden er værre end ingen kommentar.
#
# Builds er USIGNEREDE — Gatekeeper/SmartScreen advarer; forventet.

on:
  push:
    tags:
      - "jarvis-desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Eksisterende tag at bygge + uploade til (fx jarvis-desktop-v0.2.24)"
        required: true

permissions:
  contents: write

jobs:
  # Opretter releasen ÉN gang før build-matrixen, så de 3 parallelle platform-jobs
  # ikke racer om at CREATE'e samme tag (det gav "already_exists" → Linux-artefakter
  # tabt på 0.2.94). Bagefter UPLOADER build-jobs kun til den eksisterende release.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" \
              --notes "Automated desk release $tag"

  build:
    name: build-${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    defaults:
      run:
        working-directory: apps/jarvis-desk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/jarvis-desk/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Package (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Ingen Apple-signing/notarisering sat op — byg usigneret.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # ÉN SKRIVER. Tidligere uploadede alle tre platform-jobs direkte til
      # samme release, og det gav et TAVST tab: 23/9-2026 meldte win-jobbet
      # exit 0 med `latest.yml` navngivet i loggen, og filen var alligevel
      # ikke i release'en. Et samtidigt upload havde overskrevet asset-listen.
      #
      # Retry-loekken der stod her kunne ikke fange det: den proever kun igen
      # ved en FEJLKODE, og der var ingen. Derfor laegger platform-jobbene nu
      # deres filer op som workflow-artefakter, og ét afsluttende job samler
      # dem og uploader — saa er der kun én skriver til release'en.
      - name: Gem artefakter til publicering
        uses: actions/upload-artifact@v4
        with:
          name: desk-${{ matrix.platform }}
          path: |
            apps/jarvis-desk/release/*.deb
            apps/jarvis-desk/release/*.AppImage
            apps/jarvis-desk/release/*.dmg
            apps/jarvis-desk/release/*.zip
            apps/jarvis-desk/release/*.exe
            apps/jarvis-desk/release/latest*.yml
            apps/jarvis-desk/release/*.blockmap
          if-no-files-found: error
          retention-days: 3

  # Den eneste der skriver til release'en.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Hent alle platformes artefakter
        uses: actions/download-artifact@v4
        with:
          path: artefakter

      - name: Upload samlet — og VERIFICER at alt landede
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # `mapfile` + `find -print0`, IKKE `$( ... )`: Windows-filen hedder
          # «J.A.R.V.I.S Setup 0.6.81.exe» MED mellemrum, og en tur gennem
          # kommando-substitution ordopdeler den i tre stumper. Maalt 23/9-2026:
          # «no matches found for artefakter/desk-win/J.A.R.V.I.S». Det gamle
          # workflow ramte det aldrig, fordi hver platform globbede sine egne
          # filer direkte ind i et array.
          mapfile -d '' filer < <(find artefakter -type f -print0)
          if [ ${#filer[@]} -eq 0 ]; then
            echo "Ingen artefakter — build-jobbene leverede intet."
            exit 1
          fi
          printf 'Uploader %s fil(er):\n' "${#filer[@]}"
          printf '  %s\n' "${filer[@]}"

          for forsoeg in 1 2 3 4 5; do
            if gh release upload "$tag" "${filer[@]}" \
                 --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Uploadet i forsoeg $forsoeg."
              break
            fi
            # En manglende fil er ikke forbigaaende. At proeve igen fem gange
            # brugte 2,5 minut paa at gentage den samme fejl (23/9-2026), og
            # skjulte at aarsagen var vores egen filliste og ikke GitHub.
            for f in "${filer[@]}"; do
              [ -f "$f" ] || { echo "Filen findes ikke: $f — ikke et forbigaaende problem."; exit 1; }
            done
            vent=$((forsoeg * 10))
            echo "Forsoeg $forsoeg fejlede — venter ${vent}s."
            sleep "$vent"
            if [ "$forsoeg" = 5 ]; then echo "Kunne ikke uploade."; exit 1; fi
          done

          # VERIFIKATION. Det forrige tab var tavst: upload'en sagde ok, filen
          # var der ikke. Nu spoerger vi release'en hvad den FAKTISK har, og
          # fejler hoejlydt hvis noget mangler.
          echo "Verificerer at alle filer er i release'en…"
          # GitHub OMDOEBER ved upload: alt uden for [A-Za-z0-9._-] bliver til
          # et punktum, saa «J.A.R.V.I.S Setup 0.6.81.exe» ligger som
          # «J.A.R.V.I.S.Setup.0.6.81.exe». Maalt 23/9-2026: uden den regel
          # meldte verifikationen de to Windows-filer MANGLENDE, selvom alle
          # elleve laa der. Begge sider normaliseres, saa vi sammenligner
          # aebler med aebler.
          normaliser() { sed 's/[^A-Za-z0-9._-]/./g'; }
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json assets -q '.assets[].name' | normaliser | sort > /tmp/oppe.txt
          mangler=0
          for f in "${filer[@]}"; do
            raat="$(basename "$f")"
            navn="$(printf '%s' "$raat" | normaliser)"
            if ! grep -Fxq "$navn" /tmp/oppe.txt; then
              echo "MANGLER i release'en: $raat (som '$navn')"
              mangler=1
            fi
          done
          if [ "$mangler" = 1 ]; then
            echo "Release'en er ufuldstaendig — feeden ville love en version den ikke kan levere."
            exit 1
          fi
          echo "Alle ${#filer[@]} filer bekraeftet i release'en."
