default_install_hook_types: [pre-commit, commit-msg, pre-push, pre-rebase]

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
        exclude: |
          (?x)^(
              \.claude/worktrees/.*
              |\.git/.*
              |.*\.ipynb
              |.*/__pycache__/.*
          )$

  # Pre-push only: runs jarvis-runtime startup path (lifespan) without
  # serving traffic. Catches the class of bugs that put the systemd
  # service in a restart loop — kwarg drift between caller and function
  # signature, missing DB columns, init-order issues, import failures.
  # ~4s on a warm system. See scripts/smoke_test_startup.py.
  - repo: local
    hooks:
      # Pre-commit: enforce test coverage for core/ changes.
      # Scans staged .py files under core/ and blocks commit if any
      # are missing a corresponding tests/test_<module>.py file.
      - id: enforce-test-coverage
        name: Enforce test coverage (core/ → tests/)
        entry: /opt/conda/envs/ai/bin/python scripts/enforce_test_coverage.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Pre-commit: et nyt varigt format skal stå i registret med en ejer,
      # en beskrivelse og en dato. Jeg indførte selv `device_presence.json`
      # 20/9-2026 uden at registrere det — der var intet sted at gøre det.
      # Se docs/persistens/README.md, inkl. hvad registret IKKE kan.
      - id: verify-persistens
        name: Varige formater skal stå i registret
        entry: /opt/conda/envs/ai/bin/python scripts/verify_persistens.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Pre-commit: ingen NYE kaldere der læser en hel samtale-historik
      # synkront. `get_chat_session` gjorde Bjørns samtale til 21,5 MB, og
      # 14 af dens 45 kaldesteder læser alt for at bruge ét metadata-felt.
      # Skraldespærre mod docs/guards/history_read_baseline.json.
      - id: verify-history-reads
        name: Ingen nye læsninger af en hel samtale-historik
        entry: /opt/conda/envs/ai/bin/python scripts/verify_history_reads.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Pre-commit: en note skal have status, slags og sine fire
      # overskrifter — «Overvejede alternativer» især. En note uden fravalg
      # er en annoncering, ikke en beslutning. Og `forenkling` er en slags
      # på lige fod med `funktion`: at fjerne noget igen skal være
      # dokumenteret arbejde. Se docs/notes/README.md.
      - id: verify-notes
        name: Noter skal have status, slags og fravalg
        entry: /opt/conda/envs/ai/bin/python scripts/verify_notes.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Pre-commit: hver vagt skal have en test der ser den sige nej.
      # DeepSeek-harness har 60 verify-scripts og en .spec til hvert et. Vi
      # havde fire vagter uden — og en kilde-vagt der greppede efter en
      # streng målte engang næsten ingenting, uden at nogen opdagede det.
      - id: verify-guard-tests
        name: Hver vagt skal have en test der ser den afvise
        entry: /opt/conda/envs/ai/bin/python scripts/verify_guard_tests.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Pre-commit: en slugt undtagelse skal kunne forklares.
      # DeepSeek-harness' regel (20/9-2026): «An empty catch names the error
      # and why; keep its try to one statement.» Samme dag slugte en bar
      # except en NameError i _app_device_live, så funktionen ALTID svarede
      # nej og en proaktiv besked gik til Discord i stedet for appen.
      # Skraldespærre mod docs/guards/silent_except_baseline.json: flere end
      # grundlinjen er en fejl, færre skrives ind med --skriv-grundlinje.
      - id: verify-silent-except
        name: Slugte undtagelser skal navngives (skraldespærre)
        entry: /opt/conda/envs/ai/bin/python scripts/verify_silent_except.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Pre-commit: block kitchen-sink commits (mix of code + scaffolding,
      # or >20 files across multiple top-level domains). Catches the
      # 2026-05-25 anti-pattern where Jarvis bundled 8400+ lines of
      # composio scaffolding into a "spec revision" commit.
      - id: enforce-commit-hygiene
        name: Block kitchen-sink commits
        entry: /opt/conda/envs/ai/bin/python scripts/enforce_commit_hygiene.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Pre-commit: block Jarvis-issued API keys (jvs-<user>-<hex>) from
      # being committed. detect-secrets' entropy detector missed
      # `***REDACTED-LEAKED-KEY-2026-05-06***` in commit a1f1f9ee on
      # 2026-05-06 because the hex chunk alone was below the threshold
      # in context. This regex-based check is unambiguous: any literal
      # matching `jvs-[a-z0-9]+-[0-9a-f]{20,}` in staged content fails.
      - id: block-jvs-keys
        name: Block jvs-* API keys
        entry: scripts/block_jvs_keys.sh
        language: script
        pass_filenames: true
        stages: [pre-commit]

      # Pre-commit: block credential-navne der tildeles en literal streng.
      # detect-secrets missede engang et 8-tegns mail-kodeord i en modulkonstant
      # — for lav entropi, intet sk-/ghp_-præfiks — og kontoen blev senere
      # misbrugt. Denne hook ser på NAVNET, ikke værdiens entropi: hedder
      # variablen noget med pass/token/secret/api_key, må den ikke tildeles en
      # literal streng. Samme rationale som block-jvs-keys ovenfor.
      - id: block-literal-credentials
        name: Block literal credentials (navn-baseret, ikke entropi)
        entry: /opt/conda/envs/ai/bin/python scripts/block_literal_credentials.py
        language: system
        pass_filenames: true
        stages: [pre-commit]

      # Pre-commit: docs drift-sikring (SP5). Blocks a commit whose staged
      # source changes leave a generated doc un-regenerated, or whose docs
      # contain a broken markdown link. Staleness is scoped to the staged
      # source trees so the hook stays fast. Advisory (non-blocking) drift
      # lands in docs/drift_report.json + the jc docs-drift nerve.
      - id: docs-drift-check
        name: Docs drift (broken links + un-regenerated generated docs)
        entry: /opt/conda/envs/ai/bin/python scripts/docs_drift_check.py --check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: jarvis-runtime-startup-smoke
        name: Jarvis runtime startup smoke test
        entry: /opt/conda/envs/ai/bin/python scripts/smoke_test_startup.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: commit-attribution-message
        name: Require commit attribution trailers
        entry: /opt/conda/envs/ai/bin/python scripts/validate_commit_attribution.py --message-file
        language: system
        stages: [commit-msg]

      - id: commit-attribution-range
        name: Validate pushed commit attribution range
        entry: /opt/conda/envs/ai/bin/python scripts/validate_commit_attribution.py --pre-push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: block-unattributed-rebase
        name: Block rebase that preserves stale actor attribution
        entry: /opt/conda/envs/ai/bin/python scripts/block_unattributed_rebase.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-rebase]
